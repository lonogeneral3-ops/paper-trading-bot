name: Paper trading bot

on:
  schedule:
    # Quelques minutes après la clôture de chaque bougie 1h (UTC).
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: paper-bot-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: Cycle horaire (argent fictif)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe public price APIs
        run: |
          python - << 'PY'
          import urllib.request, json
          urls = [
              "https://api.binance.us/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=1",
              "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=1",
              "https://api.kraken.com/0/public/OHLC?pair=XBTUSDT&interval=60",
          ]
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "paper-bot-probe"})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      print(f"OK  HTTP {resp.status}  {url}")
              except Exception as exc:
                  print(f"FAIL {url}  {exc}")
          PY

      - name: Run one bot cycle (catch-up included)
        run: python bot.py --once

      - name: Commit state and dashboard
        run: |
          set -euo pipefail
          git config user.name "lonogeneral3-ops"
          git config user.email "360435022+lonogeneral3-ops@users.noreply.github.com"
          git add data/state.json data/trades.csv data/equity.csv \
                  dashboard/index.html docs/index.html docs/.nojekyll \
                  equity.png || true
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "chore: update paper trading state [skip ci]"
            git push
          fi
