name: Paper trading bot

on:
  schedule:
    # Quelques minutes après la clôture de chaque bougie 1h (UTC).
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: paper-bot-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: Cycle horaire (argent fictif)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one bot cycle (catch-up included)
        run: python bot.py --once

      - name: Résumé
        run: python report.py

      - name: Commit state
        run: |
          set -euo pipefail
          git config user.name "lonogeneral3-ops"
          git config user.email "360435022+lonogeneral3-ops@users.noreply.github.com"
          git add data/ config.json equity.png
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "chore: update paper trading state [skip ci]"
            git pull --rebase --autostash
            git push
          fi
